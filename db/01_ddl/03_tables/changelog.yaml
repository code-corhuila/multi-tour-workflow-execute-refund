databaseChangeLog:
  - changeSet:
      id: execute-refund-ddl-tables-001
      author: FernandaRobayo
      labels: "HU-WFL-003,ddl,tables"
      comment: "The execute-refund saga and its steps, saved after every step so a restart can resume or compensate (Annex E, rule 2)."
      changes:
        - sqlFile:
            path: 001_create_execute_refund_saga.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_execute_refund_saga.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
